[project]
name = "retail-bi"
version = "0.1.0"
description = "Retail BI : exploration Pandas, nettoyage, KPI, SQLite et visualisations"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
    "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
